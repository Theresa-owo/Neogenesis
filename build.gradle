plugins {
    id 'java'
    id 'org.jetbrains.kotlin.jvm' version '2.4.10'
}

group = 'net.theresa'
version = '5.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

kotlin {
    jvmToolchain(21)
}

repositories {
    mavenCentral() // https://repo.maven.apache.org/maven2/
    // Mojang-pinned artifacts (authlib, icu4j-core-mojang, paulscode sound libs)
    maven { url = 'https://libraries.minecraft.net/' }
}

dependencies {
    // ---- LWJGL 3.4.3 (latest): GL/GLFW/OpenAL/Vulkan bindings + Windows natives ----
    implementation platform('org.lwjgl:lwjgl-bom:3.4.3')
    implementation 'org.lwjgl:lwjgl'
    implementation 'org.lwjgl:lwjgl-glfw'
    implementation 'org.lwjgl:lwjgl-opengl'
    implementation 'org.lwjgl:lwjgl-openal'
    implementation 'org.lwjgl:lwjgl-vulkan'
    implementation 'org.lwjgl:lwjgl-shaderc'
    implementation 'org.lwjgl:lwjgl-stb' // NeoUI: stb_truetype vector font rendering
    runtimeOnly 'org.lwjgl:lwjgl::natives-windows'
    runtimeOnly 'org.lwjgl:lwjgl-glfw::natives-windows'
    runtimeOnly 'org.lwjgl:lwjgl-opengl::natives-windows'
    runtimeOnly 'org.lwjgl:lwjgl-openal::natives-windows'
    runtimeOnly 'org.lwjgl:lwjgl-shaderc::natives-windows'
    runtimeOnly 'org.lwjgl:lwjgl-stb::natives-windows'
    // lwjgl-vulkan ships no Windows natives: it binds the driver-provided vulkan-1.dll loader

    // ---- Latest stable toolchain / library stack ----
    implementation 'org.joml:joml:1.10.9' // camera math for the Vulkan backend
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.4.10'
    implementation 'org.jetbrains.kotlin:kotlin-reflect:2.4.10'
    implementation 'com.google.guava:guava:33.7.1-jre'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'org.luaj:luaj-jse:3.0.1' // NeoUI: Lua scripting layer
    implementation 'commons-io:commons-io:2.22.0'
    implementation 'org.apache.commons:commons-lang3:3.20.0'
    implementation 'commons-codec:commons-codec:1.22.1'
    implementation 'net.sf.jopt-simple:jopt-simple:5.0.4'
    implementation 'io.netty:netty-all:4.2.17.Final'
    implementation 'org.apache.logging.log4j:log4j-api:2.26.1'
    implementation 'org.apache.logging.log4j:log4j-core:2.26.1'
    implementation 'com.github.oshi:oshi-core:7.6.0'
    implementation 'org.reflections:reflections:0.10.2'
    implementation 'org.apache.ant:ant:1.10.17' // libsrc/speex ant task
    implementation files('lib/j-ogg-all-1.0.6.jar') // J-Ogg is not published to any Maven repository
    runtimeOnly 'org.slf4j:slf4j-nop:2.0.18'

    // ---- Mojang-pinned (game runtime contract; no newer versions exist) ----
    implementation 'com.mojang:authlib:1.5.21'
    implementation 'com.ibm.icu:icu4j-core-mojang:51.2'
    implementation 'com.paulscode:soundsystem:20120107'
    implementation 'com.paulscode:codecwav:20101023'
    implementation 'com.paulscode:codecjorbis:20101023'
    implementation 'com.paulscode:libraryjavasound:20101123'
    implementation 'com.paulscode:librarylwjglopenal:20100824'
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
            exclude 'libsrc/lwjglx/test/**'
        }
        kotlin {
            srcDirs = ['src']
            exclude 'libsrc/lwjglx/test/**'
        }
        resources {
            srcDirs = ['src/assets', 'src']
            exclude 'libsrc/lwjglx/test/**'
            exclude '**/*.java', '**/*.kt'
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    archiveBaseName = 'MeowClient'
    manifest {
        attributes(
                'Main-Class': 'net.minecraft.client.main.Main',
                'Implementation-Title': 'Neogenesis',
                'Implementation-Version': project.version
        )
    }
}

tasks.register('printRuntimeClasspath') {
    group = 'build'
    description = 'Prints the runtime classpath (useful for compiling standalone test classes).'
    doLast {
        println sourceSets.main.runtimeClasspath.asPath
    }
}

tasks.register('runClient', JavaExec) {
    group = 'run'
    description = 'Runs the Neogenesis client (OpenGL backend).'
    mainClass = 'net.minecraft.client.main.Main'
    classpath = sourceSets.main.runtimeClasspath
    workingDir = rootDir
    jvmArgs '-Xmx2G', '-Dfile.encoding=UTF-8',
            "-Dneogenesis.renderer=${project.findProperty('renderer') ?: 'opengl'}",
            "-Dneogenesis.joinWorld=${project.findProperty('joinWorld') ?: ''}"
    if (project.hasProperty('jvmExtra')) {
        jvmArgs project.property('jvmExtra').toString().split(' ').toList()
    }
    systemProperties System.properties
    args '--accessToken', '0',
         '--username', 'Theresa',
         '--version', 'Neogenesis',
         '--userProperties', '{}',
         '--gameDir', layout.projectDirectory.dir('.minecraft').asFile.absolutePath,
         '--assetsDir', layout.projectDirectory.dir('.minecraft/assets').asFile.absolutePath
}
